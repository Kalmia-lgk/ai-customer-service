<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 客服</title>
  <link rel="stylesheet" href="/assets/css/tokens.css?v=3.0" />
  <link rel="stylesheet" href="/assets/css/base.css?v=3.0" />
  <link rel="stylesheet" href="css/app.css?v=3.0" />
  <script>
    // 首屏前应用主题，避免闪烁
    document.documentElement.dataset.theme =
      localStorage.getItem("aicc_theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <div id="app">
    <!-- 会话侧栏 -->
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="wordmark">AI 客服</span>
        <button class="icon-btn" id="btn-collapse" title="收起侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <button class="btn btn-primary" id="btn-new-session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        新会话
      </button>
      <nav id="session-list" aria-label="会话列表"></nav>
    </aside>

    <!-- 主区域 -->
    <main id="main">
      <header id="topbar">
        <button class="icon-btn" id="btn-expand" title="展开侧栏" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <span id="topbar-title">新会话</span>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="btn-escalate">转人工</button>
          <button class="icon-btn" id="btn-theme" title="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </header>

      <!-- 人工客服状态条 -->
      <div id="ticket-banner" hidden>
        <span class="dot dot-warning" id="ticket-status-text">已提交人工工单，客服接入后将在此对话</span>
        <button class="btn btn-ghost btn-sm" id="btn-back-ai" hidden>返回 AI 对话</button>
      </div>

      <!-- 消息流 -->
      <div id="chat-scroll">
        <div id="chat-column">
          <div id="empty-state">
            <div class="empty-logo">AI 客服</div>
            <p class="empty-sub">基于知识库的智能问答，回答不了的可随时转人工</p>
            <div class="example-grid">
              <button class="example-card" data-q="你们支持退款吗？流程是什么样的？">你们支持退款吗？流程是什么样的？</button>
              <button class="example-card" data-q="介绍一下你们的产品和服务">介绍一下你们的产品和服务</button>
              <button class="example-card" data-q="我遇到了问题，想找人工客服">我遇到了问题，想找人工客服</button>
            </div>
          </div>
          <div id="messages"></div>
        </div>
      </div>

      <!-- 输入区 -->
      <div id="composer-wrap">
        <div id="composer" class="card">
          <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="icon-btn" id="btn-send" title="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <p id="composer-hint">回答由 AI 生成，重要信息请以人工客服确认为准</p>
      </div>
    </main>
  </div>

  <div id="toast-root"></div>

  <script src="/assets/vendor/marked.min.js?v=3.0"></script>
  <script src="/assets/vendor/purify.min.js?v=3.0"></script>
  <script type="module" src="js/app.js?v=3.0"></script>
</body>
</html>
