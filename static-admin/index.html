<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>控制台 · AI 客服</title>
  <link rel="stylesheet" href="/assets/css/tokens.css?v=3.0" />
  <link rel="stylesheet" href="/assets/css/base.css?v=3.0" />
  <link rel="stylesheet" href="css/admin.css?v=3.0" />
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("aicc_theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" hidden>
    <div class="login-card card">
      <div class="login-brand">AI 客服 <span>控制台</span></div>
      <p id="login-subtitle" class="login-sub">使用管理员账号登录</p>
      <form id="login-form">
        <div class="field" id="field-name" hidden>
          <label>姓名</label>
          <input class="input" id="login-name" autocomplete="name" />
        </div>
        <div class="field">
          <label>邮箱</label>
          <input class="input" id="login-email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input" id="login-password" type="password" required minlength="6" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary login-submit" type="submit" id="login-submit">登 录</button>
      </form>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app-view" hidden>
    <aside id="nav">
      <div class="nav-brand">AI 客服 <span>控制台</span></div>
      <nav id="nav-menu">
        <a href="#/overview" data-page="overview">概览</a>
        <a href="#/tickets" data-page="tickets">工单</a>
        <a href="#/knowledge" data-page="knowledge">知识库</a>
        <a href="#/users" data-page="users">用户</a>
        <a href="#/settings" data-page="settings">设置</a>
      </nav>
      <div class="nav-foot">
        <button class="icon-btn" id="btn-theme" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="nav-user">
          <div class="nav-user-name" id="nav-user-name"></div>
          <div class="nav-user-role" id="nav-user-role"></div>
        </div>
        <button class="icon-btn" id="btn-logout" title="退出登录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <main id="page"></main>
  </div>

  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="/assets/vendor/marked.min.js?v=3.0"></script>
  <script src="/assets/vendor/purify.min.js?v=3.0"></script>
  <script type="module" src="js/app.js?v=3.0"></script>
</body>
</html>
